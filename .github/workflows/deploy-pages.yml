name: Deploy DuanOS web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export Expo web app for GitHub Pages
        env:
          DEPLOY_TARGET: github-pages
          EXPO_BASE_URL: /DuanOS
        run: npx expo export --platform web
      - name: Fix GitHub Pages project paths
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path("dist").rglob("*"):
              if p.is_file() and p.suffix in {".html", ".js", ".css", ".json"}:
                  s = p.read_text()
                  s = s.replace("/_expo/", "/DuanOS/_expo/").replace("/assets/", "/DuanOS/assets/")
                  p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
