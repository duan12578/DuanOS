name: DuanOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          EXPO_OFFLINE: '1'
      - run: npm run export
        env:
          EXPO_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: duanos-v0.1.1-bundles
          path: dist
          retention-days: 7
